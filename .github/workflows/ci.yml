name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Unit + golden-regression tests. The live CQL integration tests self-skip when
      # the CQF-Ruler server (:8095) is absent, so no sidecar is needed in CI.
      - name: Test (library)
        run: dotnet test impl/csharp/NhiPasFhir.sln --configuration Release
      - name: Build (demo app)
        run: dotnet build demo/NhiPasDemo/NhiPasDemo.csproj --configuration Release
