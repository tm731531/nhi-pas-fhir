name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Unit + golden-regression tests. The live CQL integration tests report as SKIPPED
      # (via [SkippableFact]) when the CQF-Ruler server (:8095) is absent — no sidecar needed in CI.
      - name: Test (library)
        run: dotnet test impl/csharp/NhiPasFhir.sln --configuration Release
      - name: Build (demo app)
        run: dotnet build demo/NhiPasDemo/NhiPasDemo.csproj --configuration Release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Reference implementation (mirror of the spec) — proves the language-agnostic contract twice.
      - name: Test (python reference)
        working-directory: impl/python
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
